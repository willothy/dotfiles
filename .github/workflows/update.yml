name: update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # crucible is a private flake input fetched over ssh.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CRUCIBLE_DEPLOY_KEY }}

      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      - name: Update flake.lock
        run: nix flake update 2>&1 | tee update.log

      # Only open a PR for a lock that evaluates on every host. PRs opened with
      # GITHUB_TOKEN don't trigger the eval workflow, so this is the check.
      - name: nostromo
        run: nix eval --raw .#nixosConfigurations.nostromo.config.system.build.toplevel.drvPath

      - name: prometheus
        run: nix eval --raw .#nixosConfigurations.prometheus.config.system.build.toplevel.drvPath

      - name: macbonk
        run: nix eval --raw .#darwinConfigurations.macbonk.system.drvPath

      - name: PR body
        run: |
          {
            echo 'Weekly `nix flake update`. nostromo, prometheus and macbonk all evaluate with this lock.'
            echo
            echo '```'
            grep -E '^(•|  →)' update.log || true
            echo '```'
          } > pr-body.md
          rm update.log

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update-flake-lock
          commit-message: "flake.lock: update"
          title: "flake.lock: update"
          body-path: pr-body.md
          add-paths: flake.lock
          delete-branch: true
